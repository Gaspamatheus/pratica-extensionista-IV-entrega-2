# CD: quando a CI passa na main, gera as imagens Docker da API e do app
# e publica no GitHub Container Registry (ghcr.io), com tag "latest" e o hash do commit.
# No servidor (ou no seu computador): docker compose pull && docker compose up -d
name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publicar:
    name: Docker build e push para o GHCR
    # Só publica se a CI terminou com sucesso (ou se for disparado à mão)
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - imagem: gado-corte-api
            contexto: api
          - imagem: gado-corte-web
            contexto: app
    steps:
      - uses: actions/checkout@v4
        with:
          # o commit que passou na CI
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Nome da imagem (o GHCR exige minúsculas)
        id: nome
        run: echo "imagem=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.imagem }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags (latest + commit)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.nome.outputs.imagem }}
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.contexto }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.imagem }}
          cache-to: type=gha,mode=max,scope=${{ matrix.imagem }}
