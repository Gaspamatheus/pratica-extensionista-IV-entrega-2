# Configuração do SonarCloud (usada pelo job "sonarcloud" da CI).
# Ajuste projectKey e organization para os valores mostrados no SonarCloud ao importar o repositório.
sonar.projectKey=Gaspamatheus_pratica-extensionista-IV-entrega-2
sonar.organization=gaspamatheus
sonar.projectName=Gestão de Gado de Corte

sonar.sourceEncoding=UTF-8
sonar.sources=api/src/main/java,app/src
sonar.tests=api/src/test/java,app/src
sonar.exclusions=app/src/**/*.test.js,app/src/**/*.test.jsx,app/src/test/**
sonar.test.inclusions=api/src/test/java/**,app/src/**/*.test.js,app/src/**/*.test.jsx

# Java: classes compiladas e cobertura do JaCoCo (mvn verify)
sonar.java.binaries=api/target/classes
sonar.coverage.jacoco.xmlReportPaths=api/target/site/jacoco/jacoco.xml

# JavaScript: cobertura do Vitest (npm run test:coverage)
sonar.javascript.lcov.reportPaths=app/coverage/lcov.info
