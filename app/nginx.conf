# Nginx do contêiner "web": serve o build do React e repassa a API.

# Protocolo original da requisição. Atrás do túnel HTTPS (cloudflared) o Nginx recebe http,
# mas o navegador está em https: o túnel avisa pelo cabeçalho X-Forwarded-Proto.
map $http_x_forwarded_proto $proto_original {
    default $http_x_forwarded_proto;
    ""      $scheme;
}
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
    gzip_min_length 1024;

    # Resolve o nome "api" pelo DNS do Docker na hora da requisição,
    # assim o Nginx sobe mesmo que a API ainda esteja iniciando.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8080;

    # ---------- API (mesma origem do app: sem CORS) ----------
    # Host com a porta e o protocolo original: a API compara com a origem do navegador e
    # reconhece que app e API estão na mesma origem (senão recusaria o login como CORS).
    location /api/ {
        proxy_pass $api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proto_original;
        proxy_read_timeout 30s;
        client_max_body_size 2m;
    }

    # Swagger da API também pelo endereço do app
    location ~ ^/(swagger-ui|swagger-ui\.html|v3/api-docs) {
        proxy_pass $api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proto_original;
    }

    # ---------- PWA ----------
    # Service worker, manifest e index.html nunca ficam em cache do navegador:
    # é assim que o app percebe que saiu uma versão nova.
    location ~ ^/(sw\.js|registerSW\.js|workbox-.*\.js|index\.html)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # Arquivos com hash no nome (gerados pelo Vite) podem ficar em cache por 1 ano
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Rotas do React Router (/animais, /vacinas/nova...) caem no index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
